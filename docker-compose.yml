services:
  web:
    build: .
    image: game-library:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/game-library.db
      MIGRATIONS_PATH: /app/drizzle
    volumes:
      # Named volume keeps the SQLite file across container rebuilds.
      - game-library-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  game-library-data:
