name: deckside

services:
  web:
    build: .
    image: deckside:latest
    init: true
    restart: unless-stopped
    ports:
      # Local-only by default. Set HOST_PORT for another host port, or
      # BIND_ADDRESS to open it to another trusted device.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3210}:3000"
    environment:
      DATABASE_PATH: /data/deckside.db
      MIGRATIONS_PATH: /app/drizzle
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    volumes:
      # Named volume keeps the SQLite file across container rebuilds.
      - data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
